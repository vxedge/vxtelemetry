# cargo-deny configuration — supply-chain hygiene (advisories, licenses, sources).
# Run locally: cargo deny check   (CI runs it on every push/PR)

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # unsafe-libyaml is unmaintained upstream (repository archived 2024-03-25, last release
    # 0.2.11) — an informational "unmaintained" advisory, not a vulnerability. It is reached
    # only through serde_yaml_ng 0.10.0 (`cargo tree -i unsafe-libyaml`), which is the latest
    # published release (checked 2026-10-14), so no bump removes it. Replacing the YAML
    # parser is a deliberate decision shared with vxedge (same dependency, same ignore there:
    # vxedge/vxedge#11), not a CI side effect. EXPIRES 2027-01-14: cargo-deny does not enforce
    # this date, so re-check then and delete this entry if a maintained replacement landed.
    "RUSTSEC-2024-0449",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# In-workspace path deps carry no version by design; only external wildcards are banned.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
