[package]
name = "vxtelemetry"
description = "vxedge telemetry: scrape agent metrics per experiment manifest, archive results"
publish = false
version = "0.9.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/vxedge/vxtelemetry"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "io-util", "fs"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
# `.vxpignore` matching for the workspace identity (`vxws/2`): the gitignore matcher only, never
# its directory walker, which reads global and environment ignore rules.
ignore = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Archive v2 compresses its record files with zstd (decision X-7); Python reads them with
# `compression.zstd` from 3.14.
zstd = { version = "0.13", default-features = false }
regex-lite = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
